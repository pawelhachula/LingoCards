<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <g filter="url(#shadow)">
    <!-- Back card -->
    <rect x="176" y="120" width="220" height="280" rx="24" fill="#ffffff" opacity="0.8" transform="rotate(15 286 260)" />
    <!-- Front card -->
    <rect x="136" y="140" width="220" height="280" rx="24" fill="#ffffff" />
    
    <!-- Letter L -->
    <path d="M 190 200 L 190 340 C 190 350 198 358 208 358 L 290 358" fill="none" stroke="#3B82F6" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
