<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#0f172a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LingoCards - Interaktywna Nauka Angielskiego z Fiszkami</title>
    <meta name="description" content="LingoCards to nowoczesna aplikacja webowa do nauki języka angielskiego za pomocą interaktywnych fiszek 3D, quizów i gier językowych." />
    <!-- Prevent FOUC by setting theme from localStorage before React mounts -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('lingocards_last_theme') || 'navy';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
